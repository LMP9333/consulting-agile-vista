    <script type="text/javascript">
  (function(l) {
    if (l.search[1] === 'p' ) {
      var decoded = l.search.slice(1).split('&').map(function(s) {
        return s.replace(/~and~/g, '&')
      }).filter(function(v) { return v.indexOf('p=') === 0; })[0];
      if (decoded) {
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + '/' + decoded.slice(2) +
          (l.search.split('&').filter(function(s) { return s.indexOf('p=') !== 0; }).join('&') ? '?' + l.search.split('&').filter(function(s) { return s.indexOf('p=') !== 0; }).join('&') : '') +
          l.hash
        );
      }
    }
  }(window.location));
